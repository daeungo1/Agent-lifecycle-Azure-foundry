[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-lifecycle"
version = "0.1.0"
description = "Enterprise Microsoft Foundry Hosted Agent lifecycle foundation"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]