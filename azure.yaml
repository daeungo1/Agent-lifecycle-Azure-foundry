name: enterprise-agent-lifecycle

infra:
  provider: microsoft.foundry
  path: deploy/infra

hooks:
  postprovision:
    posix:
      shell: sh
      run: ./deploy/hooks/postprovision.sh
    windows:
      shell: pwsh
      run: ./deploy/hooks/postprovision.ps1
  postdeploy:
    posix:
      shell: sh
      run: ./deploy/hooks/postdeploy.sh
    windows:
      shell: pwsh
      run: ./deploy/hooks/postdeploy.ps1

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: "2026-03-17"
        sku:
          name: GlobalStandard
          capacity: 10

  development-agent:
    project: .
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    kind: hosted
    name: development-agent
    codeConfiguration:
      runtime: python_3_13
      entryPoint: agent.py
      dependencyResolution: remote_build
    environmentVariables:
      - name: FOUNDRY_PROJECT_ENDPOINT
        value: ${AZURE_AI_PROJECT_ENDPOINT}
      - name: DEPARTMENT
        value: development
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: TOOLBOX_ENDPOINT
        value: ${TOOLBOX_ENDPOINT_DEVELOPMENT}
      - name: APPLICATIONINSIGHTS_CONNECTION_STRING
        value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - name: ENABLE_INSTRUMENTATION
        value: "true"
      - name: ENABLE_SENSITIVE_DATA
        value: "false"
    protocols:
      - protocol: responses
        version: 2.0.0

  human-resources-agent:
    project: .
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    kind: hosted
    name: human-resources-agent
    codeConfiguration:
      runtime: python_3_13
      entryPoint: agent.py
      dependencyResolution: remote_build
    environmentVariables:
      - name: FOUNDRY_PROJECT_ENDPOINT
        value: ${AZURE_AI_PROJECT_ENDPOINT}
      - name: DEPARTMENT
        value: human-resources
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: TOOLBOX_ENDPOINT
        value: ${TOOLBOX_ENDPOINT_HUMAN_RESOURCES}
      - name: APPLICATIONINSIGHTS_CONNECTION_STRING
        value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - name: ENABLE_INSTRUMENTATION
        value: "true"
      - name: ENABLE_SENSITIVE_DATA
        value: "false"
    protocols:
      - protocol: responses
        version: 2.0.0

  marketing-agent:
    project: .
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    kind: hosted
    name: marketing-agent
    codeConfiguration:
      runtime: python_3_13
      entryPoint: agent.py
      dependencyResolution: remote_build
    environmentVariables:
      - name: FOUNDRY_PROJECT_ENDPOINT
        value: ${AZURE_AI_PROJECT_ENDPOINT}
      - name: DEPARTMENT
        value: marketing
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: TOOLBOX_ENDPOINT
        value: ${TOOLBOX_ENDPOINT_MARKETING}
      - name: APPLICATIONINSIGHTS_CONNECTION_STRING
        value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      - name: ENABLE_INSTRUMENTATION
        value: "true"
      - name: ENABLE_SENSITIVE_DATA
        value: "false"
    protocols:
      - protocol: responses
        version: 2.0.0