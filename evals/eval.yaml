name: development-agent-deployment-eval

agent:
  name: development-agent

dataset:
  local_uri: evals/live/development.jsonl

# Evaluator identifiers must carry the "builtin." prefix; the Foundry evals API
# rejects the bare names with EvaluatorNotFound.
#
# builtin.tool_call_accuracy is intentionally absent: ToolCallAccuracyEvaluator
# requires a tool_definitions input, and `azd ai agent eval run` provides no way to
# supply it (its azure_ai_target_completions data source maps only {{item.query}},
# and adding tool_definitions to the dataset rows is never mapped through). Every
# sample errors, and because the gate blocks on evaluator errors that would keep
# promotion permanently red for a reason unrelated to agent quality.
# Re-add it once the eval configuration supports evaluator data mapping.
evaluators:
  - builtin.intent_resolution
  - builtin.task_adherence
  - builtin.relevance
  - builtin.groundedness

options:
  eval_model: gpt-5.4-mini
  pass_threshold: 0.70
  fail_on_missing_tool_call: true
  require_grounded_citation: true
