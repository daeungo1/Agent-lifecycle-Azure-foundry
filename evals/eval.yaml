name: enterprise-lifecycle-local-eval

agent:
  name: department-lifecycle-coordinator

dataset:
  local_uri: evals/data

# Evaluator identifiers must carry the "builtin." prefix; the Foundry evals API
# rejects the bare names with EvaluatorNotFound.
#
# builtin.tool_call_accuracy is intentionally absent: ToolCallAccuracyEvaluator
# requires a tool_definitions input, and `azd ai agent eval run` provides no way to
# supply it (its azure_ai_target_completions data source maps only {{item.query}}).
# Including it makes every sample error, which permanently blocks the gate for a
# non-quality reason. Re-add it once the eval config supports evaluator data mapping.
evaluators:
  - builtin.intent_resolution
  - builtin.task_adherence
  - builtin.relevance
  - builtin.groundedness

tiers:
  - smoke
  - regression

smoke:
  include_files:
    - evals/data/security-boundaries.jsonl
    - evals/data/regression.jsonl
  max_samples: 12

regression:
  include_files:
    - evals/data/development.jsonl
    - evals/data/human-resources.jsonl
    - evals/data/marketing.jsonl
    - evals/data/regression.jsonl
    - evals/data/security-boundaries.jsonl

options:
  eval_model: gpt-5.4-mini
  pass_threshold: 0.70
  fail_on_missing_tool_call: true
  require_grounded_citation: true