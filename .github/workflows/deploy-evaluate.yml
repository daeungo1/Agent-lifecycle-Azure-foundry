name: deploy-evaluate

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-evaluate-${{ vars.AZURE_ENV_NAME }}
  cancel-in-progress: false

jobs:
  deploy_evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      TENANT_ID: ${{ vars.TENANT_ID }}
      SUBSCRIPTION_ID: ${{ vars.SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      A365_PREREQUISITES_CLAIMED: ${{ vars.A365_PREREQUISITES_CLAIMED }}
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ops.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Setup azd
        uses: Azure/setup-azd@v2

      - name: Build
        run: |
          python -m ruff check .
          python -m pytest tests/ops/test_eval_datasets.py -v

      - name: Install Foundry extension
        run: |
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd extension install microsoft.foundry --no-prompt

      - name: Configure OIDC authentication
        run: |
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$TENANT_ID"
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd env select "$AZURE_ENV_NAME" --no-prompt || AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd env new "$AZURE_ENV_NAME" --location "$AZURE_LOCATION" --no-prompt
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd env set AZURE_SUBSCRIPTION_ID "$SUBSCRIPTION_ID" --no-prompt
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd env set AZURE_LOCATION "$AZURE_LOCATION" --no-prompt
          if [ -n "$FOUNDRY_PROJECT_ENDPOINT" ]; then
            AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd env set FOUNDRY_PROJECT_ENDPOINT "$FOUNDRY_PROJECT_ENDPOINT" --no-prompt
            AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd env set AZURE_AI_PROJECT_ENDPOINT "$FOUNDRY_PROJECT_ENDPOINT" --no-prompt
          fi

      - name: provision
        run: |
          mkdir -p artifacts
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd provision --no-prompt

      - name: deploy
        run: |
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd deploy --no-prompt

      - name: three-agent smoke
        run: |
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd ai agent invoke development-agent "Provide a brief development sprint update with citations." --no-prompt --output raw > artifacts/smoke-development.txt
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd ai agent invoke human-resources-agent "Summarize a policy onboarding checklist with citations." --no-prompt --output raw > artifacts/smoke-human-resources.txt
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd ai agent invoke marketing-agent "Draft a campaign launch summary with citations." --no-prompt --output raw > artifacts/smoke-marketing.txt
          python -m lifecycle_ops.operations.deployment_check --smoke-artifacts-dir artifacts --output-json artifacts/verify-deployment.json

      - name: Evaluate
        run: |
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd extension list --output json > artifacts/azd-extensions.json
          if AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd ai agent eval run --help > artifacts/eval-help.txt 2>&1; then
            if grep -q -- "--config" artifacts/eval-help.txt; then
              gate_status=0
              for entry in \
                "development:evals/eval.yaml" \
                "human-resources:evals/human-resources.yaml" \
                "marketing:evals/marketing.yaml"; do
                artifact_name="${entry%%:*}"
                config_path="${entry#*:}"
                AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd ai agent eval run \
                  --config "$config_path" --no-prompt \
                  > "artifacts/eval-${artifact_name}-run.txt"
                AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd ai agent eval show --out-file \
                  "artifacts/eval-${artifact_name}-results.json" --no-prompt
                if ! python -m lifecycle_ops.evaluation.gate \
                  --config "$config_path" \
                  --results "artifacts/eval-${artifact_name}-results.json" \
                  --output "artifacts/eval-${artifact_name}-gate.json"; then
                  gate_status=1
                fi
              done
              exit "$gate_status"
            else
              echo "Current evaluation command does not support --config" >&2
              cat artifacts/eval-help.txt
              exit 1
            fi
          else
            echo "Current extension does not expose evaluation commands" >&2
            cat artifacts/eval-help.txt
            exit 1
          fi

      - name: Operate
        run: |
          python -m lifecycle_ops.provisioning.continuous_eval > artifacts/continuous-evaluation.json
          python -m lifecycle_ops.operations.agent365.readiness > artifacts/agent365-observability.json
          if [ "${A365_PREREQUISITES_CLAIMED:-false}" = "true" ]; then
            python -m lifecycle_ops.operations.agent365.registry --prerequisites-claimed > artifacts/agent365-registry.json
          else
            python -m lifecycle_ops.operations.agent365.registry > artifacts/agent365-registry.json
          fi

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evaluate-artifacts
          path: artifacts/
          if-no-files-found: warn