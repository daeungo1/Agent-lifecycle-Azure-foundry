<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Azure Resource Architecture</title>
  <desc id="desc">Cloud Solution Architect view of current Azure resources, post-provision bindings, identity boundaries, operate integrations, and optional production hardening.</desc>
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-target" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 32px 'Segoe UI', Arial, sans-serif; }
      .subtitle { fill: #475569; font: 400 15px 'Segoe UI', Arial, sans-serif; }
      .boundary-title { fill: #0f172a; font: 700 16px 'Segoe UI', Arial, sans-serif; }
      .boundary-copy { fill: #64748b; font: 400 12px 'Segoe UI', Arial, sans-serif; }
      .node-title { fill: #0f172a; font: 700 14px 'Segoe UI', Arial, sans-serif; }
      .node-copy { fill: #475569; font: 400 12px 'Segoe UI', Arial, sans-serif; }
      .tiny { fill: #64748b; font: 600 10px 'Segoe UI', Arial, sans-serif; }
      .white-title { fill: #ffffff; font: 700 14px 'Segoe UI', Arial, sans-serif; }
      .white-copy { fill: #dbeafe; font: 400 12px 'Segoe UI', Arial, sans-serif; }
      .container { fill: #ffffff; stroke-width: 1.5; }
      .node { stroke-width: 1.4; rx: 8; }
      .solid { fill: none; stroke: #2563eb; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .post { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; }
      .target { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="canvas" width="1440" height="1000" />
  <text class="title" x="42" y="52">Azure Resource Architecture</text>
  <text class="subtitle" x="42" y="80">Current deployment, post-provision bindings, and production hardening target</text>

  <g id="delivery-plane" aria-label="GitHub Actions OIDC and Azure deployment">
    <rect class="container" x="38" y="128" width="242" height="246" rx="8" stroke="#60a5fa" />
    <text class="boundary-title" x="58" y="158">Delivery plane</text>
    <text class="boundary-copy" x="58" y="178">GitHub private repository</text>

    <rect class="node" x="58" y="198" width="202" height="70" fill="#eff6ff" stroke="#3b82f6" />
    <text class="node-title" x="78" y="227">GitHub Actions</text>
    <text class="node-copy" x="78" y="249">OIDC workload federation</text>

    <rect class="node" x="58" y="286" width="202" height="66" fill="#eff6ff" stroke="#3b82f6" />
    <text class="node-title" x="78" y="315">azd + Bicep</text>
    <text class="node-copy" x="78" y="337">Provision and direct deploy</text>

    <path class="solid" d="M159 268 V286" marker-end="url(#arrow-solid)" />
  </g>

  <g id="identity-plane" aria-label="Microsoft Entra ID and Azure RBAC">
    <rect class="container" x="38" y="398" width="242" height="300" rx="8" stroke="#475569" />
    <text class="boundary-title" x="58" y="428">Identity plane</text>

    <rect class="node" x="58" y="450" width="202" height="62" fill="#f1f5f9" stroke="#64748b" />
    <text class="node-title" x="78" y="477">Microsoft Entra ID</text>
    <text class="node-copy" x="78" y="497">Tenant and Agent ID</text>

    <rect class="node" x="58" y="532" width="202" height="62" fill="#f1f5f9" stroke="#64748b" />
    <text class="node-title" x="78" y="559">Workflow principal</text>
    <text class="node-copy" x="78" y="579">Provision and Search write</text>

    <rect class="node" x="58" y="614" width="202" height="62" fill="#f1f5f9" stroke="#64748b" />
    <text class="node-title" x="78" y="641">Agent identities</text>
    <text class="node-copy" x="78" y="661">Shared + own Search read</text>

    <path class="solid" d="M159 512 V532" marker-end="url(#arrow-solid)" />
    <path class="solid" d="M159 594 V614" marker-end="url(#arrow-solid)" />
  </g>

  <g id="azure-subscription" aria-label="Azure subscription boundary">
    <rect x="310" y="112" width="1092" height="836" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <rect x="330" y="95" width="211" height="34" rx="8" fill="#dbeafe" />
    <text class="boundary-title" x="348" y="118" fill="#1d4ed8">Azure subscription</text>
    <text class="boundary-copy" x="555" y="117">East US 2 | Managed with azd environment agent-lifecycle-demo</text>

    <path class="solid" d="M280 319 H298 V195 H338" marker-end="url(#arrow-solid)" />
    <path class="solid" d="M280 563 H304 V292 H367" marker-end="url(#arrow-solid)" />

    <g id="resource-group" aria-label="rg-agent-lifecycle-demo">
      <rect x="338" y="158" width="1036" height="548" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
      <text class="boundary-title" x="360" y="190">Resource group: rg-agent-lifecycle-demo</text>
      <text class="boundary-copy" x="700" y="190">Current: public endpoints | Entra RBAC | local auth disabled</text>

      <g id="foundry-account" aria-label="Microsoft Foundry AIServices account">
        <rect class="container" x="365" y="218" width="578" height="460" rx="8" stroke="#14b8a6" />
        <rect x="385" y="202" width="214" height="32" rx="8" fill="#ccfbf1" />
        <text class="boundary-title" x="402" y="224" fill="#0f766e">Microsoft Foundry</text>

        <rect class="node" x="390" y="250" width="528" height="64" fill="#ecfeff" stroke="#0d9488" />
        <text class="node-title" x="412" y="278">AIServices account (system-assigned identity)</text>
        <text class="node-copy" x="412" y="299">Project management enabled | Local auth disabled</text>

        <g id="foundry-project" aria-label="Foundry project and model deployment">
          <rect class="node" x="390" y="334" width="248" height="84" fill="#f0fdfa" stroke="#0d9488" />
          <text class="node-title" x="410" y="363">Foundry project</text>
          <text class="node-copy" x="410" y="385">agent-lifecycle-demo</text>
          <text class="tiny" x="410" y="404">System-assigned identity</text>

          <rect class="node" x="658" y="334" width="260" height="84" fill="#eff6ff" stroke="#3b82f6" />
          <text class="node-title" x="678" y="363">Model deployment</text>
          <text class="node-copy" x="678" y="385">gpt-5.4-mini | GlobalStandard</text>
          <text class="tiny" x="678" y="404">Capacity 10</text>
        </g>

        <g id="hosted-agents" aria-label="Three direct code hosted agents">
          <text class="tiny" x="391" y="451">Hosted Agents - immutable direct code versions</text>
          <rect class="node" x="390" y="466" width="160" height="76" fill="#f0fdfa" stroke="#0d9488" />
          <text class="node-title" x="410" y="495">Development</text>
          <text class="node-copy" x="410" y="517">Responses 2.0</text>

          <rect class="node" x="574" y="466" width="160" height="76" fill="#f0fdfa" stroke="#0d9488" />
          <text class="node-title" x="594" y="495">Human Resources</text>
          <text class="node-copy" x="594" y="517">Responses 2.0</text>

          <rect class="node" x="758" y="466" width="160" height="76" fill="#f0fdfa" stroke="#0d9488" />
          <text class="node-title" x="778" y="495">Marketing</text>
          <text class="node-copy" x="778" y="517">Responses 2.0</text>

          <text class="tiny" x="391" y="568">POST-PROVISION FOUNDRY TOOLBOX BINDINGS</text>
          <rect class="node" x="390" y="581" width="160" height="58" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="7 5" />
          <text class="node-title" x="420" y="607">Dev toolbox</text>
          <text class="tiny" x="406" y="627">Shared + Development</text>
          <rect class="node" x="574" y="581" width="160" height="58" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="7 5" />
          <text class="node-title" x="611" y="607">HR toolbox</text>
          <text class="tiny" x="620" y="627">Shared + HR</text>
          <rect class="node" x="758" y="581" width="160" height="58" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="7 5" />
          <text class="node-title" x="788" y="607">Mktg toolbox</text>
          <text class="tiny" x="779" y="627">Shared + Marketing</text>

          <path class="post" d="M470 542 V581" marker-end="url(#arrow-dashed)" />
          <path class="post" d="M654 542 V581" marker-end="url(#arrow-dashed)" />
          <path class="post" d="M838 542 V581" marker-end="url(#arrow-dashed)" />
        </g>
      </g>

      <g id="search-boundaries" aria-label="Four isolated Azure AI Search services">
        <rect class="container" x="970" y="218" width="378" height="460" rx="8" stroke="#8b5cf6" />
        <rect x="990" y="202" width="205" height="32" rx="8" fill="#ede9fe" />
        <text class="boundary-title" x="1007" y="224" fill="#6d28d9">Azure AI Search</text>
        <text class="boundary-copy" x="994" y="257">Four Basic services form security boundaries</text>

        <rect class="node" x="994" y="277" width="330" height="72" fill="#f5f3ff" stroke="#7c3aed" />
        <text class="node-title" x="1008" y="304">entlifecyc-shared-srch</text>
        <text class="tiny" x="1008" y="329">Basic | local auth disabled</text>
        <rect x="1166" y="287" width="144" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-dasharray="7 5" />
        <text class="tiny" x="1180" y="307">Foundry IQ artifacts</text>
        <text class="tiny" x="1180" y="327">post-provision</text>

        <rect class="node" x="994" y="366" width="330" height="72" fill="#f5f3ff" stroke="#7c3aed" />
        <text class="node-title" x="1008" y="393">entlifecyc-dev-srch</text>
        <text class="tiny" x="1008" y="418">Basic | local auth disabled</text>
        <rect x="1166" y="376" width="144" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-dasharray="7 5" />
        <text class="tiny" x="1180" y="396">Foundry IQ artifacts</text>
        <text class="tiny" x="1180" y="416">post-provision</text>

        <rect class="node" x="994" y="455" width="330" height="72" fill="#f5f3ff" stroke="#7c3aed" />
        <text class="node-title" x="1008" y="482">entlifecyc-hr-srch</text>
        <text class="tiny" x="1008" y="507">Basic | local auth disabled</text>
        <rect x="1166" y="465" width="144" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-dasharray="7 5" />
        <text class="tiny" x="1180" y="485">Foundry IQ artifacts</text>
        <text class="tiny" x="1180" y="505">post-provision</text>

        <rect class="node" x="994" y="544" width="330" height="72" fill="#f5f3ff" stroke="#7c3aed" />
        <text class="node-title" x="1008" y="571">entlifecyc-mkt-srch</text>
        <text class="tiny" x="1008" y="596">Basic | local auth disabled</text>
        <rect x="1166" y="554" width="144" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-dasharray="7 5" />
        <text class="tiny" x="1180" y="574">Foundry IQ artifacts</text>
        <text class="tiny" x="1180" y="594">post-provision</text>

        <rect x="994" y="632" width="330" height="28" rx="8" fill="#6d28d9" />
        <text class="white-copy" x="1038" y="651">RBAC only | API keys disabled</text>
      </g>

      <g id="department-knowledge-bindings" aria-label="Each toolbox connects to shared and its own department knowledge only">
        <path class="post" d="M918 610 H970" marker-end="url(#arrow-dashed)" />
        <text class="tiny" x="920" y="641">Policy matrix enforced by connection state and Azure RBAC</text>
      </g>
    </g>

    <g id="operate-integrations" aria-label="Application Insights and Agent 365">
      <rect class="container" x="338" y="730" width="650" height="148" rx="8" stroke="#16a34a" stroke-dasharray="8 6" />
      <text class="boundary-title" x="360" y="760" fill="#15803d">Operate readiness and reconciliation</text>
      <text class="boundary-copy" x="665" y="760">No resource provisioning is implied</text>

      <rect class="node" x="360" y="782" width="185" height="70" fill="#f8fafc" stroke="#64748b" stroke-dasharray="2 6" />
      <text class="node-title" x="380" y="811">Application Insights</text>
      <text class="node-copy" x="380" y="833">External prerequisite</text>

      <rect class="node" x="570" y="782" width="185" height="70" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="7 5" />
      <text class="node-title" x="590" y="811">Continuous evaluation</text>
      <text class="node-copy" x="590" y="833">Rules reconciled after deploy</text>

      <rect class="node" x="780" y="782" width="185" height="70" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="7 5" />
      <text class="node-title" x="800" y="811">Agent 365 readiness</text>
      <text class="node-copy" x="800" y="833">Verified or prerequisite-skipped</text>

      <path class="target" d="M654 678 V716 H453 V782" marker-end="url(#arrow-target)" />
      <path class="post" d="M654 716 V782" marker-end="url(#arrow-dashed)" />
      <path class="post" d="M654 716 H872 V782" marker-end="url(#arrow-dashed)" />
    </g>

    <g id="target-hardening" aria-label="Optional private networking hardening">
      <rect x="1015" y="730" width="359" height="188" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="2 7" />
      <text class="boundary-title" x="1037" y="760">Optional hardening target</text>
      <text class="boundary-copy" x="1037" y="781">Not enabled in current baseline</text>

      <rect class="node" x="1037" y="800" width="142" height="58" fill="#ffffff" stroke="#64748b" stroke-dasharray="2 6" />
      <text class="node-title" x="1057" y="825">Private endpoint</text>
      <text class="tiny" x="1057" y="845">Foundry account</text>

      <rect class="node" x="1200" y="800" width="150" height="58" fill="#ffffff" stroke="#64748b" stroke-dasharray="2 6" />
      <text class="node-title" x="1220" y="825">Private DNS</text>
      <text class="tiny" x="1220" y="845">AI service zones</text>

      <rect class="node" x="1037" y="875" width="313" height="26" fill="#ffffff" stroke="#64748b" stroke-dasharray="2 6" />
      <text class="tiny" x="1055" y="893">Managed egress or BYO VNet | Search PE is a future extension</text>

      <path class="target" d="M943 286 H955 V710 H1098 V800" marker-end="url(#arrow-target)" />
    </g>
  </g>

  <path class="solid" d="M280 645 H318 V622 H365" marker-end="url(#arrow-solid)" />
  <path class="solid" d="M280 645 H302 V660 H970" marker-end="url(#arrow-solid)" />
  <text class="tiny" x="286" y="636">Azure RBAC</text>

  <g id="legend" aria-label="Current post-provision and target state legend">
    <rect class="container" x="38" y="730" width="242" height="188" rx="8" stroke="#cbd5e1" />
    <text class="boundary-title" x="58" y="760">Architecture legend</text>

    <line x1="60" y1="794" x2="110" y2="794" class="solid" />
    <text class="node-copy" x="124" y="799">Current deployment</text>

    <line x1="60" y1="830" x2="110" y2="830" class="post" />
    <text class="node-copy" x="124" y="835">Post-provision binding</text>

    <line x1="60" y1="866" x2="110" y2="866" class="target" />
    <text class="node-copy" x="124" y="871">Optional hardening target</text>

    <text class="tiny" x="58" y="900">Solid = Bicep or azd owned</text>
  </g>
</svg>