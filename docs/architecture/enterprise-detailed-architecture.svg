<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1140" width="1100" height="1140" role="img"
     aria-label="Detailed enterprise agent lifecycle architecture from delivery pipeline to observability">
  <title>Enterprise agent lifecycle detailed architecture</title>
  <desc>Five layers: the azd delivery pipeline, the Foundry runtime with three department agents, the knowledge layer built on Azure AI Search, the evaluation gate and operate controls, and the observability and identity plane.</desc>

  <defs>
    <marker id="d-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="1140" fill="#ffffff"/>

  <text x="30" y="36" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Enterprise Agent Lifecycle · 전체 아키텍처</text>

  <!-- ===================== 1. Delivery pipeline ===================== -->
  <rect x="30" y="56" width="1040" height="150" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="50" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#334155">1. 배포 파이프라인</text>

  <rect x="50" y="100" width="180" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="64" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">GitHub Actions</text>
  <text x="64" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ci 워크플로</text>
  <text x="64" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">deploy-evaluate</text>

  <rect x="255" y="100" width="180" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="269" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">azd provision</text>
  <text x="269" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bicep 템플릿</text>
  <text x="269" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">계정 · 모델 · Search</text>

  <rect x="460" y="100" width="180" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="474" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">postprovision 훅</text>
  <text x="474" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">관측 · KB</text>
  <text x="474" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">· 툴박스</text>

  <rect x="665" y="100" width="180" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="679" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">azd deploy</text>
  <text x="679" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">에이전트 3개</text>
  <text x="679" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">불변 버전 게시</text>

  <rect x="870" y="100" width="180" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="884" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">postdeploy 훅</text>
  <text x="884" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">부서별 RBAC</text>

  <path d="M 230 144 L 249 144" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#d-flow)"/>
  <path d="M 435 144 L 454 144" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#d-flow)"/>
  <path d="M 640 144 L 659 144" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#d-flow)"/>
  <path d="M 845 144 L 864 144" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#d-flow)"/>

  <path d="M 550 206 L 550 230" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#d-flow)"/>

  <!-- ===================== 2. Foundry runtime ===================== -->
  <rect x="30" y="236" width="1040" height="250" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="50" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">2. Microsoft Foundry 런타임</text>
  <text x="50" y="284" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">계정 cog-* · 프로젝트 agent-lifecycle-demo</text>

  <rect x="50" y="296" width="1000" height="38" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="64" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">모델 배포 gpt-5.4-mini</text>
  <text x="300" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">세 부서 에이전트와 AI 평가자가 공유</text>

  <rect x="50" y="346" width="320" height="120" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="64" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">개발팀 에이전트</text>
  <text x="64" y="392" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">coordinator + specialist × 2</text>
  <rect x="64" y="402" width="292" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="78" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">개발 툴박스</text>
  <text x="78" y="444" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">MCP · Shared + 자기 부서 KB</text>

  <rect x="390" y="346" width="320" height="120" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="1.5"/>
  <text x="404" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#be185d">인사팀 에이전트</text>
  <text x="404" y="392" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">coordinator + specialist × 2</text>
  <rect x="404" y="402" width="292" height="52" rx="8" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="418" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">인사 툴박스</text>
  <text x="418" y="444" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">MCP · Shared + 자기 부서 KB</text>

  <rect x="730" y="346" width="320" height="120" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="744" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#c2410c">마케팅팀 에이전트</text>
  <text x="744" y="392" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">coordinator + specialist × 2</text>
  <rect x="744" y="402" width="292" height="52" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="758" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">마케팅 툴박스</text>
  <text x="758" y="444" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">MCP · Shared + 자기 부서 KB</text>

  <path d="M 550 486 L 550 510" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#d-flow)"/>
  <text x="562" y="504" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">MCP 도구 호출</text>

  <!-- ===================== 3. Knowledge layer ===================== -->
  <rect x="30" y="516" width="1040" height="170" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="50" y="544" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#047857">3. 지식 계층</text>
  <text x="50" y="564" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Foundry IQ Knowledge Base가 Azure AI Search 인덱스를 감싸 부서별 격리 단위를 만듭니다</text>

  <rect x="50" y="576" width="235" height="90" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="64" y="600" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#065f46">Shared KB</text>
  <text x="64" y="622" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">전사 공통 핸드북</text>
  <text x="64" y="644" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">entlifecyc-shared-srch</text>

  <rect x="305" y="576" width="235" height="90" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="319" y="600" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#065f46">Development KB</text>
  <text x="319" y="622" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">개발 표준</text>
  <text x="319" y="644" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">entlifecyc-dev-srch</text>

  <rect x="560" y="576" width="235" height="90" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="574" y="600" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#065f46">Human Resources KB</text>
  <text x="574" y="622" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">인사 운영 정책</text>
  <text x="574" y="644" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">entlifecyc-hr-srch</text>

  <rect x="815" y="576" width="235" height="90" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="829" y="600" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#065f46">Marketing KB</text>
  <text x="829" y="622" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">캠페인 가이드</text>
  <text x="829" y="644" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">entlifecyc-mkt-srch</text>

  <path d="M 550 686 L 550 710" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#d-flow)"/>

  <!-- ===================== 4. Evaluate and operate ===================== -->
  <rect x="30" y="716" width="1040" height="180" rx="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
  <text x="50" y="744" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#7c3aed">4. 평가와 운영</text>

  <rect x="50" y="756" width="320" height="120" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="64" y="780" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">배포 게이트</text>
  <text x="64" y="802" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">골든 데이터셋 8건 × 3</text>
  <text x="64" y="824" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">intent · task · relevance ·</text>
  <text x="64" y="846" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">groundedness 임계값 0.70</text>

  <rect x="390" y="756" width="320" height="120" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="404" y="780" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">연속 평가 규칙</text>
  <text x="404" y="802" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">response.completed 이벤트</text>
  <text x="404" y="824" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">부서별 규칙 3개</text>
  <text x="404" y="846" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">시간당 실행 수 제한</text>

  <rect x="730" y="756" width="320" height="120" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="744" y="780" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Agent365</text>
  <text x="744" y="802" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">레지스트리 · 관측 거버넌스</text>
  <text x="744" y="824" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">테넌트 조건 미충족 시</text>
  <text x="744" y="846" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">prerequisite-skipped</text>

  <path d="M 550 896 L 550 920" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#d-flow)"/>

  <!-- ===================== 5. Observability and identity ===================== -->
  <rect x="30" y="926" width="1040" height="150" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="50" y="954" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#c2410c">5. 관측과 아이덴티티</text>

  <rect x="50" y="966" width="320" height="90" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="64" y="990" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Application Insights</text>
  <text x="64" y="1012" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">OTel 스팬 · Log Analytics</text>
  <text x="64" y="1034" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">cloud_RoleName = 부서-agent</text>

  <rect x="390" y="966" width="320" height="90" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="404" y="990" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Foundry Monitor</text>
  <text x="404" y="1012" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">포털에서 추적과 평가 확인</text>
  <text x="404" y="1034" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">appinsights-connection</text>

  <rect x="730" y="966" width="320" height="90" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="744" y="990" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Entra ID · RBAC</text>
  <text x="744" y="1012" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">에이전트 MI × 3 · 프로젝트 MI</text>
  <text x="744" y="1034" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Search Index Data Reader</text>

  <text x="30" y="1104" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">모든 접근은 관리 ID와 Entra 토큰으로 이루어지며 정적 자격 증명은 없습니다.</text>
  <text x="30" y="1126" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">평가 게이트를 통과하지 못하면 승격이 멈추고, 운영에서 발견한 실패 사례는 회귀 데이터셋으로 되돌아갑니다.</text>
</svg>
