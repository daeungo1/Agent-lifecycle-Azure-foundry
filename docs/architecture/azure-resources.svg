<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="1040" height="680" role="img"
     aria-label="Azure resources behind the enterprise agent lifecycle">
  <title>Azure resource architecture</title>
  <desc>One Foundry account and project host three agents, three toolboxes and one model deployment. Four Azure AI Search services carry the Knowledge Bases, Application Insights receives agent traces, and Entra RBAC scopes every managed identity.</desc>

  <defs>
    <marker id="r-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="r-obs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="r-id" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="680" fill="#ffffff"/>

  <text x="30" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155">리소스 그룹: rg-agent-lifecycle-demo</text>

  <!-- ===================== Microsoft Foundry ===================== -->
  <rect x="30" y="52" width="450" height="310" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="50" y="80" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">Microsoft Foundry</text>
  <text x="50" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">계정 + 프로젝트 · East US 2</text>

  <rect x="50" y="112" width="410" height="46" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="64" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">모델 배포</text>
  <text x="64" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">gpt-5.4-mini · GlobalStandard</text>

  <rect x="50" y="166" width="410" height="46" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="64" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Hosted Agent × 3</text>
  <text x="64" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">development · human-resources · marketing</text>

  <rect x="50" y="220" width="410" height="46" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="64" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">툴박스 × 3</text>
  <text x="64" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">부서별 MCP 도구 · Agentic Identity 연결</text>

  <rect x="50" y="274" width="410" height="46" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="64" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">프로젝트 연결</text>
  <text x="64" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">appinsights-connection · kb-*-remote-tool</text>

  <rect x="50" y="328" width="410" height="26" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="64" y="345" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Foundry IQ Knowledge Base 4개를 Search 위에 구성</text>

  <!-- ===================== Azure AI Search ===================== -->
  <rect x="580" y="52" width="430" height="310" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="598" y="80" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#047857">Azure AI Search</text>
  <text x="598" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Knowledge Base 격리 단위 · Basic × 4 · Central US</text>

  <rect x="598" y="112" width="394" height="46" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="612" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#065f46">Shared Knowledge Base</text>
  <text x="612" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">entlifecyc-shared-srch-&lt;suffix&gt;</text>

  <rect x="598" y="166" width="394" height="46" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="612" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#065f46">Development Knowledge Base</text>
  <text x="612" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">entlifecyc-dev-srch-&lt;suffix&gt;</text>

  <rect x="598" y="220" width="394" height="46" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="612" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#065f46">Human Resources Knowledge Base</text>
  <text x="612" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">entlifecyc-hr-srch-&lt;suffix&gt;</text>

  <rect x="598" y="274" width="394" height="46" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="612" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#065f46">Marketing Knowledge Base</text>
  <text x="612" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">entlifecyc-mkt-srch-&lt;suffix&gt;</text>

  <rect x="598" y="328" width="394" height="26" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="612" y="345" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">이름 접미사는 구독·리소스 그룹·지역에서 결정</text>

  <path d="M 480 214 L 574 214" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#r-dark)"/>
  <text x="490" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">MCP 조회</text>

  <!-- ===================== Observability ===================== -->
  <rect x="30" y="400" width="450" height="170" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="50" y="428" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">관측</text>

  <rect x="50" y="440" width="410" height="46" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="64" y="460" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Application Insights</text>
  <text x="64" y="478" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">에이전트 스팬 · cloud_RoleName = 부서-agent</text>

  <rect x="50" y="494" width="410" height="46" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="64" y="514" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Log Analytics 작업 영역</text>
  <text x="64" y="532" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">보존 30일 · Application Insights 백엔드</text>

  <path d="M 255 362 L 255 394" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#r-obs)"/>
  <text x="265" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">OpenTelemetry 내보내기</text>

  <!-- ===================== Identity ===================== -->
  <rect x="580" y="400" width="430" height="170" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="598" y="428" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#c2410c">Microsoft Entra ID · RBAC</text>

  <rect x="598" y="440" width="394" height="46" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="612" y="460" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">에이전트 관리 ID × 3</text>
  <text x="612" y="478" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Search Index Data Reader · Shared + 자기 부서</text>

  <rect x="598" y="494" width="394" height="46" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="612" y="514" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">프로젝트 관리 ID</text>
  <text x="612" y="532" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Foundry User · 연속 평가 규칙 등록</text>

  <path d="M 795 400 L 795 368" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r-id)"/>
  <text x="805" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c2410c">Knowledge Base별 최소 권한</text>

  <text x="30" y="600" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">azd provision이 Foundry · 모델 · Search를 만들고, postprovision 훅이 관측 · Knowledge Base · 툴박스를 구성합니다.</text>
  <text x="30" y="624" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">postdeploy 훅이 부서별 RBAC를 적용하고, 정적 자격 증명 없이 관리 ID와 Entra 토큰만 사용합니다.</text>
  <text x="30" y="648" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Azure cost 주의: Basic 등급 Search 4개와 모델 · 에이전트 런타임 비용이 발생합니다.</text>
</svg>
