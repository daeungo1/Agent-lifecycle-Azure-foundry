  <rect x="696" y="376" width="308" height="56" rx="8" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
  <text x="712" y="400" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#9d174d">Human Resources Knowledge Base</text>
  <text x="712" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">인사 운영 정책</text>

  <rect x="680" y="470" width="340" height="174" rx="14" fill="#f8fafc" stroke="#c2410c" stroke-width="2"/>
  <text x="696" y="498" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#9a3412">마케팅팀 접근 허용 범위</text>
  <rect x="926" y="482" width="82" height="22" rx="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="940" y="498" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Isolated</text>

