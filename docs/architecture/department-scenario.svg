  <text x="30" y="676" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">각 부서 툴박스는 Shared Knowledge Base와 자기 부서 Knowledge Base 두 개에만 연결됩니다.</text>
  <text x="30" y="698" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">RBAC도 같은 범위를 따릅니다. 관리 ID는 해당 두 Search 서비스에만 Search Index Data Reader 권한을 가집니다.</text>
