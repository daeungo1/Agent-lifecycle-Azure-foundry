  <text x="216" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">개발팀</text>

  <rect x="216" y="110" width="174" height="84" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
