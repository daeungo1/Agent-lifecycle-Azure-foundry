  <rect x="696" y="312" width="308" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="712" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#065f46">Shared Knowledge Base</text>
