  <text x="46" y="345" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">업무 사용자</text>
  <text x="46" y="366" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">사내 시스템 연동</text>

