<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" role="img"
     aria-label="Each department agent reaches only the Shared Knowledge Base and its own department Knowledge Base">
  <title>Department knowledge isolation</title>
  <desc>Three department agents run the same lifecycle. Every toolbox connects to the Shared Knowledge Base and its own department Knowledge Base only, so cross-department access has no path.</desc>

  <defs>
    <marker id="a-dev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="a-hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#be185d"/>
    </marker>
    <marker id="a-mkt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="a-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="720" fill="#ffffff"/>

  <text x="30" y="42" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">사용자 요청</text>
