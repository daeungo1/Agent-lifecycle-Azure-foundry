<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Agent Lifecycle</title>
  <desc id="desc">Build, provision, evaluate, and operate workflow for three department agents with isolated knowledge, Entra identity, Azure RBAC, and a production feedback loop.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d" />
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 32px 'Segoe UI', Arial, sans-serif; }
      .subtitle { fill: #475569; font: 400 15px 'Segoe UI', Arial, sans-serif; }
      .stage-label { font: 700 18px 'Segoe UI', Arial, sans-serif; letter-spacing: 0; }
      .section-title { fill: #0f172a; font: 700 17px 'Segoe UI', Arial, sans-serif; }
      .node-title { fill: #0f172a; font: 700 16px 'Segoe UI', Arial, sans-serif; }
      .node-copy { fill: #475569; font: 400 14px 'Segoe UI', Arial, sans-serif; }
      .small { fill: #64748b; font: 600 14px 'Segoe UI', Arial, sans-serif; }
      .white-title { fill: #ffffff; font: 700 16px 'Segoe UI', Arial, sans-serif; }
      .white-copy { fill: #dbeafe; font: 400 14px 'Segoe UI', Arial, sans-serif; }
      .stage { fill: #ffffff; stroke-width: 1.5; }
      .node { stroke-width: 1.5; rx: 8; }
      .flow { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .binding { fill: none; stroke-width: 1.8; stroke-dasharray: 7 6; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="canvas" width="1440" height="900" />
  <text class="title" x="52" y="57">Enterprise Agent Lifecycle</text>
  <text class="subtitle" x="52" y="84">A fail-closed Build -&gt; Evaluate -&gt; Operate loop for department-scoped Hosted Agents</text>

  <g id="build-stage" aria-label="GitHub OIDC build and validation">
    <rect class="stage" x="45" y="125" width="235" height="545" rx="8" stroke="#60a5fa" />
    <rect x="65" y="105" width="92" height="34" rx="8" fill="#dbeafe" />
    <text class="stage-label" x="84" y="128" fill="#1d4ed8">Build</text>

    <rect class="node" x="68" y="168" width="189" height="92" fill="#eff6ff" stroke="#3b82f6" />
    <text class="node-title" x="88" y="197">GitHub Actions</text>
    <text class="node-copy" x="88" y="220">OIDC federation</text>
    <text class="node-copy" x="88" y="239">No client secrets</text>

    <path class="flow" d="M162 260 V292" stroke="#2563eb" marker-end="url(#arrow-blue)" />
    <rect class="node" x="68" y="300" width="189" height="128" fill="#eff6ff" stroke="#3b82f6" />
    <text class="node-title" x="88" y="329">Build verification</text>
    <text class="node-copy" x="88" y="354">Pinned Python 3.13</text>
    <text class="node-copy" x="88" y="375">Ruff + full pytest suite</text>
    <text class="node-copy" x="88" y="396">Dataset contracts</text>
    <text class="node-copy" x="88" y="417">Bicep + params compile</text>

    <path class="flow" d="M162 428 V460" stroke="#2563eb" marker-end="url(#arrow-blue)" />
    <rect class="node" x="68" y="468" width="189" height="102" fill="#eff6ff" stroke="#3b82f6" />
    <text class="node-title" x="88" y="498">Release package</text>
    <text class="node-copy" x="88" y="522">Root package layout</text>
    <text class="node-copy" x="88" y="543">Direct code deployment</text>

    <rect x="68" y="600" width="189" height="44" rx="8" fill="#1d4ed8" />
    <text class="white-title" x="95" y="627">Build evidence ready</text>
  </g>

  <path class="flow" d="M280 397 H318" stroke="#2563eb" marker-end="url(#arrow-blue)" />

  <g id="provision-stage" aria-label="Azure provision and direct code deployment">
    <rect class="stage" x="320" y="125" width="555" height="545" rx="8" stroke="#2dd4bf" />
    <rect x="340" y="105" width="177" height="34" rx="8" fill="#ccfbf1" />
    <text class="stage-label" x="358" y="128" fill="#0f766e">Provision and deploy</text>

    <rect class="node" x="345" y="160" width="505" height="74" fill="#ecfeff" stroke="#14b8a6" />
    <text class="node-title" x="365" y="188">Microsoft Foundry project + gpt-5.4-mini</text>
    <text class="node-copy" x="365" y="211">azd provision creates Azure resources; azd deploy publishes immutable agent versions</text>

    <g id="department-agents" aria-label="Three department hosted agents">
      <text class="small" x="348" y="267">HOSTED AGENTS</text>
      <path class="flow" d="M440 234 V280" stroke="#0f766e" />

      <rect class="node" x="345" y="286" width="208" height="82" fill="#f0fdfa" stroke="#0d9488" />
      <text class="node-title" x="365" y="315">Development</text>
      <text class="node-copy" x="365" y="338">Coordinator + 2 specialists</text>
      <text class="small" x="365" y="357">Responses 2.0</text>

      <rect class="node" x="345" y="391" width="208" height="82" fill="#f0fdfa" stroke="#0d9488" />
      <text class="node-title" x="365" y="420">Human Resources</text>
      <text class="node-copy" x="365" y="443">Coordinator + 2 specialists</text>
      <text class="small" x="365" y="462">Responses 2.0</text>

      <rect class="node" x="345" y="496" width="208" height="82" fill="#f0fdfa" stroke="#0d9488" />
      <text class="node-title" x="365" y="525">Marketing</text>
      <text class="node-copy" x="365" y="548">Coordinator + 2 specialists</text>
      <text class="small" x="365" y="567">Responses 2.0</text>
    </g>

    <text class="small" x="581" y="267">TOOLBOX</text>
    <path class="flow" d="M553 327 H579" stroke="#0f766e" marker-end="url(#arrow-teal)" />
    <path class="flow" d="M553 432 H579" stroke="#0f766e" marker-end="url(#arrow-teal)" />
    <path class="flow" d="M553 537 H579" stroke="#0f766e" marker-end="url(#arrow-teal)" />

    <rect class="node" x="580" y="298" width="112" height="58" fill="#fff7ed" stroke="#ea580c" />
    <text class="node-title" x="600" y="332">Dev tools</text>
    <rect class="node" x="580" y="403" width="112" height="58" fill="#fff7ed" stroke="#ea580c" />
    <text class="node-title" x="604" y="437">HR tools</text>
    <rect class="node" x="580" y="508" width="112" height="58" fill="#fff7ed" stroke="#ea580c" />
    <text class="node-title" x="594" y="542">Mktg tools</text>

    <g id="knowledge-boundaries" aria-label="Shared and department knowledge boundaries">
      <text class="small" x="719" y="267">Foundry IQ</text>
      <rect class="node" x="716" y="279" width="134" height="54" fill="#f5f3ff" stroke="#7c3aed" />
      <text class="node-title" x="751" y="311">Shared KB</text>
      <rect class="node" x="716" y="350" width="134" height="54" fill="#f5f3ff" stroke="#7c3aed" />
      <text class="node-title" x="738" y="382">Development KB</text>
      <rect class="node" x="716" y="421" width="134" height="54" fill="#f5f3ff" stroke="#7c3aed" />
      <text class="node-title" x="748" y="453">HR KB</text>
      <rect class="node" x="716" y="492" width="134" height="54" fill="#f5f3ff" stroke="#7c3aed" />
      <text class="node-title" x="739" y="524">Marketing KB</text>

      <path class="binding" d="M692 327 H704 V306 H716" stroke="#7c3aed" marker-end="url(#arrow-violet)" />
      <path class="binding" d="M692 327 H704 V377 H716" stroke="#7c3aed" marker-end="url(#arrow-violet)" />
      <path class="binding" d="M692 432 H702 V306 H716" stroke="#7c3aed" marker-end="url(#arrow-violet)" />
      <path class="binding" d="M692 432 H716" stroke="#7c3aed" marker-end="url(#arrow-violet)" />
      <path class="binding" d="M692 537 H700 V306 H716" stroke="#7c3aed" marker-end="url(#arrow-violet)" />
      <path class="binding" d="M692 537 H704 V519 H716" stroke="#7c3aed" marker-end="url(#arrow-violet)" />
    </g>

    <rect x="345" y="608" width="505" height="38" rx="8" fill="#0f766e" />
    <text class="white-title" x="466" y="633">Three active department endpoints</text>
  </g>

  <path class="flow" d="M875 397 H907" stroke="#0f766e" marker-end="url(#arrow-teal)" />

  <g id="evaluate-stage" aria-label="Quality and security release gate">
    <rect class="stage" x="910" y="125" width="205" height="545" rx="8" stroke="#f59e0b" />
    <rect x="930" y="105" width="102" height="34" rx="8" fill="#fef3c7" />
    <text class="stage-label" x="948" y="128" fill="#b45309">Evaluate</text>

    <rect class="node" x="934" y="174" width="157" height="78" fill="#fffbeb" stroke="#f59e0b" />
    <text class="node-title" x="954" y="203">Smoke invocation</text>
    <text class="node-copy" x="954" y="226">One per department</text>

    <path class="flow" d="M1012 252 V282" stroke="#d97706" marker-end="url(#arrow-blue)" />
    <rect class="node" x="934" y="290" width="157" height="136" fill="#fffbeb" stroke="#f59e0b" />
    <text class="node-title" x="954" y="319">Batch evaluation</text>
    <text class="node-copy" x="954" y="344">Intent + adherence</text>
    <text class="node-copy" x="954" y="365">Tool-call accuracy</text>
    <text class="node-copy" x="954" y="386">Grounded citations</text>
    <text class="node-copy" x="954" y="407">Boundary denials</text>

    <path class="flow" d="M1012 426 V456" stroke="#d97706" marker-end="url(#arrow-blue)" />
    <rect x="934" y="464" width="157" height="92" rx="8" fill="#b45309" />
    <text class="white-title" x="971" y="495">Release gate</text>
    <text class="white-copy" x="960" y="519">All metrics at least 0.70</text>
    <text class="white-copy" x="974" y="539">Fail closed on drift</text>

    <rect class="node" x="934" y="585" width="157" height="52" fill="#ecfdf5" stroke="#16a34a" />
    <text class="node-title" x="968" y="617">Promote only</text>
  </g>

  <path class="flow" d="M1115 397 H1137" stroke="#15803d" marker-end="url(#arrow-green)" />

  <g id="operate-stage" aria-label="Observability continuous evaluation and governance">
    <rect class="stage" x="1140" y="125" width="255" height="545" rx="8" stroke="#22c55e" />
    <rect x="1160" y="105" width="98" height="34" rx="8" fill="#dcfce7" />
    <text class="stage-label" x="1178" y="128" fill="#15803d">Operate</text>

    <rect class="node" x="1165" y="174" width="205" height="88" fill="#f0fdf4" stroke="#16a34a" />
    <text class="node-title" x="1185" y="204">Application Insights</text>
    <text class="node-copy" x="1185" y="228">Traces, latency, tokens</text>
    <text class="small" x="1185" y="248">Sensitive content disabled</text>

    <rect class="node" x="1165" y="286" width="205" height="88" fill="#f0fdf4" stroke="#16a34a" />
    <text class="node-title" x="1185" y="316">Continuous evaluation</text>
    <text class="node-copy" x="1185" y="340">Response-completed rules</text>
    <text class="small" x="1185" y="360">One rule per department</text>

    <rect class="node" x="1165" y="398" width="205" height="88" fill="#f0fdf4" stroke="#16a34a" />
    <text class="node-title" x="1185" y="428">Agent 365 governance</text>
    <text class="node-copy" x="1185" y="452">Registry + ownership</text>
    <text class="small" x="1185" y="472">Verified or prerequisite-skipped</text>

    <rect class="node" x="1165" y="510" width="205" height="92" fill="#ecfdf5" stroke="#16a34a" />
    <text class="node-title" x="1185" y="540">Operator review</text>
    <text class="node-copy" x="1185" y="564">Find low-scoring traces</text>
    <text class="node-copy" x="1185" y="585">Curate regression cases</text>

    <rect x="1165" y="616" width="205" height="30" rx="8" fill="#15803d" />
    <text class="white-title" x="1211" y="637">Day-2 controls</text>
  </g>

  <g id="identity-rail" aria-label="Entra ID managed identity and Azure RBAC">
    <rect x="45" y="708" width="1350" height="78" rx="8" fill="#172554" />
    <text class="white-title" x="70" y="738">Identity and policy rail</text>
    <text class="white-copy" x="70" y="762">Microsoft Entra ID | Managed and agentic identities | Azure RBAC | Shared + own department only | Raw OBO tokens never enter prompts or logs</text>
    <circle cx="1329" cy="747" r="20" fill="#2563eb" />
    <path d="M1320 747 l6 6 13 -15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g id="feedback-loop" aria-label="Curated production trace feedback">
    <path class="flow" d="M1268 670 V825 H164 V670" stroke="#15803d" stroke-dasharray="10 8" marker-end="url(#arrow-green)" />
    <rect x="585" y="807" width="278" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" />
    <text class="section-title" x="624" y="832">Feedback loop: traces -&gt; regression data</text>
  </g>
</svg>