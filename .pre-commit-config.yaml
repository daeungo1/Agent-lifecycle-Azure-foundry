repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: >-
          uv run --no-project --python 3.13 --prerelease=allow
          --with-requirements requirements-dev.txt
          python -m ruff check
        language: system
        types: [python]
      - id: ruff-format-check
        name: Ruff format check
        entry: >-
          uv run --no-project --python 3.13 --prerelease=allow
          --with-requirements requirements-dev.txt
          python -m ruff format --check
        language: system
        types: [python]
